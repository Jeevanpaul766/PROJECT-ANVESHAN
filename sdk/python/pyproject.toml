[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anveshan"
version = "0.2.0"
description = "Python SDK & LangGraph/LangChain integration for Project Anveshan — Deep Research OS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Project Anveshan Contributors" }
]
keywords = [
    "deep-research",
    "autonomous-agents",
    "langchain",
    "langgraph",
    "langsmith",
    "research-agent",
    "academic-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
all = [
    "anveshan[langchain,dev]",
]

[project.urls]
Homepage = "https://github.com/Jeevanpaul766/PROJECT-ANVESHAN"
Repository = "https://github.com/Jeevanpaul766/PROJECT-ANVESHAN.git"
Documentation = "https://github.com/Jeevanpaul766/PROJECT-ANVESHAN/blob/main/docs/architecture.md"
